<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Thread — MyBaseCamp</title>
    <link rel="stylesheet" href="/css/show.css">
</head>
<body>
<nav>
    <div class="nav-left">
        <a href="/dashboard" class="logo">MyBaseCamp</a>
        <span class="nav-sep">/</span>
        <span class="nav-current">New thread</span>
    </div>
    <form action="/sessions" method="POST" style="display:inline">
        <input type="hidden" name="_method" value="DELETE">
        <button type="submit" class="btn-logout">Logout</button>
    </form>
</nav>

<div class="page-center">
    <div class="content-wrapper">
        <a th:href="@{/projects/{id}/show(id=${project.id})}" class="back-link">← Back to Project</a>

        <h1 class="page-title">New thread</h1>
        <p class="page-subtitle">Start a discussion</p>

        <div th:if="${error != null}" class="flash flash-error">
            <span th:text="${error}"></span>
        </div>

        <div class="form-card">
            <form th:action="@{/projects/{id}/threads(id=${project.id})}" method="POST">
                <div class="form-group">
                    <label for="threadTitle">Thread title</label>
                    <input type="text" id="threadTitle" name="title" placeholder="Discussion topic..." required>
                </div>
                <div class="form-actions">
                    <a th:href="@{/projects/{id}/show(id=${project.id})}" class="btn-cancel">Cancel</a>
                    <button type="submit" class="btn-submit">Create thread</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
